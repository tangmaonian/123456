name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip newest project zip
        run: |
          ls -la
          ZIP=$(ls dual_stock_chart_v*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          mkdir app
          unzip -q "$ZIP" -d app
          ls -la app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          test -f app/lib/ui/stock_pages.dart

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        working-directory: app
        run: flutter create . --platforms=android --project-name dual_stock_chart --org com.dualstock

      - name: Patch manifest
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="双线股票分析"#' "$MANIFEST"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Show built APK
        run: |
          find app/build -name "*.apk" -print
          ls -la app/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-stock-chart-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

# END OF FILE
