
name: Build Android APK v1.0

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract latest source ZIP
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'dual_stock_chart_v*_source.zip' | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo "找不到 dual_stock_chart_v*_source.zip"
            exit 1
          fi
          echo "Using source archive: $ZIP"
          mkdir -p app
          unzip -q "$ZIP" -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          test -f app/lib/ui/stock_pages.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: app
        run: flutter create . --platforms=android --project-name dual_stock_chart --org com.dualstock

      - name: Configure Android app
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\
              <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="双线股票分析"#' "$MANIFEST"

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Diagnose Dart compile error
        working-directory: app
        run: |
          echo "===== stock_pages.dart lines 230-255 ====="
          nl -ba lib/ui/stock_pages.dart | sed -n '230,255p'

          echo "===== MinutePoint definitions and usages ====="
          grep -R -n -E --include='*.dart' 'class MinutePoint|MinutePoint\(' lib || true

          echo "===== price average volume declarations ====="
          grep -n -E 'price|average|volume' lib/ui/stock_pages.dart | head -n 100 || true

      - name: Fix MinutePoint volume type
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("lib/ui/stock_pages.dart")
          source = path.read_text(encoding="utf-8")

          pattern = (
              r"final\s+volume\s*=\s*"
              r"fields\.length\s*>\s*3\s*\?\s*"
              r"\(double\.tryParse\(fields\[3\]\)\s*\?\?\s*0\)"
              r"\s*:\s*0\s*;"
          )

          replacement = (
              "final volume = fields.length > 3 ? "
              "(double.tryParse(fields[3]) ?? 0.0) : 0.0;"
          )

          updated, count = re.subn(pattern, replacement, source)

          if count != 1:
              print(f"错误：预期修正1处，实际匹配到{count}处。")
              print("请检查 stock_pages.dart 中的 volume 声明。")
              raise SystemExit(1)

          path.write_text(updated, encoding="utf-8")
          print("成功：已将 volume 的默认值修正为 double 类型 0.0。")
          PY

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-stock-chart-v1.0-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
