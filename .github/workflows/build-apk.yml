
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project ZIP
        run: |
          set -e
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi
          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Flutter project
        run: |
          set -e
          PROJECT_DIR=$(find extracted -name pubspec.yaml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found: $PROJECT_DIR"

      - name: Generate Android project files
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Prepare APK
        run: |
          set -e
          mkdir -p dist
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" \
             dist/dual-stock-chart-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-stock-chart-apk
          path: dist/dual-stock-chart-release.apk
          if-no-files-found: error
