
name: Build Android APK v1.2

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract v1.2 source ZIP
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'dual_stock_chart_v1.2_source.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "找不到 dual_stock_chart_v1.2_source.zip，请先上传到仓库根目录。"
            exit 1
          fi
          echo "Using source archive: $ZIP"
          mkdir -p app
          unzip -q "$ZIP" -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart
          test -f app/lib/ui/chart_screen.dart
          test -f app/lib/ui/stock_pages.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: app
        run: flutter create . --platforms=android --project-name dual_stock_chart --org com.dualstock

      - name: Configure Android app
        working-directory: app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\
              <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="双线股票分析"#' "$MANIFEST"

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: app
        run: dart format lib

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-stock-chart-v1.2-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
